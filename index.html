<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e50914'/%3E%3Cpath d='M18 14h28v8H27v10h16v8H27v10h19v8H18z' fill='white'/%3E%3C/svg%3E">
  <title>Banca Digital — Quadrinhos & Mangás</title>
  <meta name="description" content="Uma banca digital para descobrir, pesquisar e ler quadrinhos e mangás.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2.2.7.20">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#" data-action="home">
        <span class="brand-mark">HQ</span>
        <span>Banca<span class="brand-accent">Digital</span></span>
      </a>

      <nav class="main-nav" aria-label="Principal">
        <button data-section="home" class="nav-link active">Início</button>
        <button data-section="comics" class="nav-link">Quadrinhos</button>
        <button data-section="blog" class="nav-link">Blogs</button>
        <button data-section="shelf" class="nav-link">Minha estante</button>
        <button data-action="messages" class="nav-link messages-nav" style="display:none">Mensagens</button>
        <button data-section="local-box" class="nav-link local-box-nav" style="display:none">Minha caixa</button>
      </nav>

      <div class="top-actions">
        <button class="reader-btn" data-action="random">🎲 Aleatório</button>
        <button class="icon-btn notification-bell" data-action="notifications-popup" title="Notificações" aria-label="Notificações"><span class="notification-bell-icon">🔔</span><span class="notification-badge" hidden>0</span></button>
        <button class="icon-btn" data-action="focus-search" title="Pesquisar">⌕</button>
        <button class="avatar" data-action="open-auth" title="Entrar ou abrir minha estante"><img class="top-avatar-img" src="https://i.pinimg.com/736x/be/17/10/be1710edaace144c17bdaf6deb2d2cc8.jpg" alt="Perfil"></button>
      </div>
    </header>

    <main id="main"></main>

    <footer class="footer">
      <div>
        <strong>Banca Digital</strong>
        <span>Uma banca de quadrinhos feita para a era digital.</span>
      </div>
      <div class="footer-links">
        <button data-action="submit">Enviar quadrinho</button>
        <button data-action="open-admin">Administração</button>
      </div>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <!-- PDF.js -->
  <script>
    window.pdfjsReady = new Promise((resolve, reject) => {
      window.resolvePdfjs = resolve;
      window.rejectPdfjs = reject;
    });
  </script>
  <script type="module">
    // Carrega PDF.js localmente e configura o worker.
    // Certifique-se de que os arquivos pdf.min.mjs e pdf.worker.min.mjs
    // estão na pasta /js/pdfjs/ do seu projeto.
    import("./js/pdfjs/pdf.min.mjs").then(pdfjsLib => {
      const library = pdfjsLib;
      window.pdfjsLib = library;
      library.GlobalWorkerOptions.workerSrc = "./js/pdfjs/pdf.worker.min.mjs";
      window.resolvePdfjs(library);
      return library;
    }).catch(error => {
      console.error("Não foi possível carregar o PDF.js.", error);
      window.rejectPdfjs(error);
      throw error;
    });
  </script>
  <!-- JSZip para CBZ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js?v=2.2.7.36"></script>
  <script src="js/app.js?v=2.2.7.71"></script>
</body>
</html>
